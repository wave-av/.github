name: Bug
description: Something is broken or behaving incorrectly.
title: "[Bug] "
type: Bug
labels: ["bug"]
projects: ["wave-av/3"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Area** and **Priority** are required — they place this on the WAVE board correctly and keep the queue triaged.
  - type: textarea
    id: summary
    attributes:
      label: What's wrong
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include the command/request and the observed vs expected result.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which WAVE pillar owns this?
      options:
        - Spine
        - Spokes
        - Fabric
        - Ledger
        - Observe
        - Substrate
        - Identity
        - Charter
        - Workstation
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "P0 = drop-everything · P1 = this cycle · P2 = backlog"
      options:
        - P0
        - P1
        - P2
    validations:
      required: true
