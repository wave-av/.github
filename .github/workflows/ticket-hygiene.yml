name: ticket-hygiene
# Enforces the WAVE board's field discipline (Type/Area/Priority) — orthogonal to issue-ops-triage,
# which only manages trust/category labels. Writes Projects v2 custom fields from the required Issue-Form
# dropdowns, and sweeps the board for items still missing them.
#
# Auth: mints an installation token from the wave-issue-ops-bot App (org secrets BOT_ISSUE_OPS_APP_ID
# / BOT_ISSUE_OPS_PRIVATE_KEY). The App must be granted "organization projects: write" for the board
# writes to succeed (the default GITHUB_TOKEN cannot write org projects). Flip repo variable
# HYGIENE_ENABLED=true to arm once the permission is granted.
# Untrusted input (issue body) is passed via env and matched ONLY against the board's own option list —
# never interpolated into a shell command or a query string.

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "17 14 * * *"   # daily 14:17 UTC board sweep
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ticket-hygiene-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: true

env:
  PROJECT_ID: PVT_kwDODJSefc4BeLIW   # WAVE — Work (org project #3)
  AREA_FIELD_ID: PVTSSF_lADODJSefc4BeLIWzhYnUa0
  PRIORITY_FIELD_ID: PVTSSF_lADODJSefc4BeLIWzhYnUaw

jobs:
  map-fields:
    # Set Area/Priority board fields from the Issue-Form dropdown answers when an issue is filed/edited.
    if: vars.HYGIENE_ENABLED == 'true' && github.event_name == 'issues'
    runs-on: ubuntu-latest
    env:
      ISSUE_NODE: ${{ github.event.issue.node_id }}
      ISSUE_NUM: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      BODY: ${{ github.event.issue.body }}
    steps:
      - name: Mint issue-ops App token
        id: tok
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_ISSUE_OPS_APP_ID }}
          private-key: ${{ secrets.BOT_ISSUE_OPS_PRIVATE_KEY }}
          owner: wave-av
      - name: Map dropdown answers → board fields
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail

          # --- board field + option maps (queried live, no hardcoded drift) ---
          fields="$(gh api graphql -f query='
            query($p:ID!){ node(id:$p){ ... on ProjectV2 {
              fields(first:50){ nodes{ ... on ProjectV2SingleSelectField {
                id name options{ id name } } } } } } }' -F p="$PROJECT_ID")"

          field_id() { jq -r --arg n "$1" '.data.node.fields.nodes[]|select(.name==$n)|.id' <<<"$fields"; }
          option_id() { jq -r --arg n "$1" --arg v "$2" \
            '.data.node.fields.nodes[]|select(.name==$n)|.options[]|select(.name==$v)|.id' <<<"$fields"; }

          # First non-empty line under a "### <Heading>" section of the rendered form body.
          answer() { awk -v h="### $1" 'BEGIN{f=0} $0==h{f=1;next} f&&NF{print;exit}' <<<"$BODY" | tr -d '\r'; }

          # --- resolve (or create) this issue's project item ---
          item="$(gh api graphql -f query='
            query($n:ID!){ node(id:$n){ ... on Issue {
              projectItems(first:20,includeArchived:false){ nodes{ id project{ id } } } } } }' \
            -F n="$ISSUE_NODE" \
            --jq ".data.node.projectItems.nodes[]|select(.project.id==\"$PROJECT_ID\")|.id" | head -1 || true)"
          if [ -z "${item:-}" ]; then
            item="$(gh api graphql -f query='
              mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }' \
              -F p="$PROJECT_ID" -F c="$ISSUE_NODE" --jq '.data.addProjectV2ItemById.item.id')"
            echo "added issue #$ISSUE_NUM to board as item $item"
          fi

          set_field() {  # $1=field name  $2=answer value
            local fname="$1" val opt fid
            val="$(answer "$fname")"
            [ -n "$val" ] || { echo "no '$fname' answer in body — skipping"; return 0; }
            fid="$(field_id "$fname")"; opt="$(option_id "$fname" "$val")"
            if [ -z "$opt" ]; then echo "::warning::'$fname'='$val' not a valid board option — skipped"; return 0; fi
            gh api graphql -f query='
              mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{
                projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' \
              -F p="$PROJECT_ID" -F i="$item" -F f="$fid" -F o="$opt" >/dev/null
            echo "set $fname = $val"
          }

          set_field "Area"
          set_field "Priority"

  sweep:
    # Daily backstop: label any open board item still missing Area or Priority as needs-triage.
    if: vars.HYGIENE_ENABLED == 'true' && github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Mint issue-ops App token
        id: tok
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_ISSUE_OPS_APP_ID }}
          private-key: ${{ secrets.BOT_ISSUE_OPS_PRIVATE_KEY }}
          owner: wave-av
      - name: Flag under-fielded items
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          missing=0; after=""; page=0
          classified=0; unlabeled=0; failed=0; truncated=0; standing=0
          : > label-failures.txt
          # Repos whose `needs-triage` label we have already ensured this run. `gh issue edit
          # --add-label` fails outright if the label does not exist IN THE TARGET REPO, and the
          # board spans 130+ repos — so ensuring it once in $GITHUB_REPOSITORY (this repo) covered
          # exactly the one repo the sweep almost never writes to.
          ensured_repos=" "

          # Every label write goes through here. The previous form was
          #   gh issue edit ... >/dev/null 2>&1 || true
          # followed by an unconditional counter bump, which made "labelled 108 items" and
          # "attempted 108 and every one was rejected" print the same summary line. That is the
          # exact failure this sweep exists to detect, running inside the detector: 108 open
          # claude-workstation board items were selected for labelling every day and their issue
          # timelines carry no `needs-triage` event at all, while the job reported success.
          #
          # $repo/$num are third-party values from the API and are passed ONLY as argv to `gh`,
          # never spliced into a shell string. Captured stderr is stripped of control characters
          # and truncated before it is echoed, because it can quote issue/repo text.
          # Returns 0 on success; on failure records the reason and returns 1 WITHOUT tripping
          # `set -e` at the call site (callers test the return value).
          edit_label() {  # $1=repo  $2=num  $3=--add-label|--remove-label
            _r="$1"; _n="$2"; _op="$3"; _rc=0
            case "$ensured_repos" in
              *" $_r "*) : ;;
              *)
                gh label create needs-triage -R "$_r" -c "#D93F0B" \
                  -d "On the board but missing Type/Area/Priority" >/dev/null 2>&1 || true
                ensured_repos="${ensured_repos}${_r} "
                ;;
            esac
            # Bounded retry: GitHub secondary rate limits reject content-mutating writes with 403
            # once a burst exceeds ~80/min, and this loop can issue several hundred back to back.
            for _try in 1 2 3; do
              if gh issue edit "$_n" -R "$_r" "$_op" needs-triage >/dev/null 2>edit.err; then
                _rc=0; break
              fi
              _rc=1
              # Only a rate-limit rejection is worth retrying; a 404/permission error will fail
              # identically three times. Do not sleep after the final attempt — that backoff
              # would be paid immediately before giving up.
              grep -qiE 'rate limit|secondary|abuse' edit.err || break
              # NB: an `if`, not `[ ... ] && sleep`. Under `set -e` that one-liner returns 1 on the
              # final attempt and would kill the whole step at the exact moment it is handling a
              # failure — the sweep would die instead of reporting.
              if [ "$_try" -lt 3 ]; then sleep $(( _try * 20 )); fi
            done
            if [ "$_rc" -ne 0 ]; then
              failed=$((failed+1))
              printf '%s#%s %s: %s\n' "$_r" "$_n" "$_op" \
                "$(tr -d '\000-\037' < edit.err | cut -c1-160)" >> label-failures.txt
            fi
            # A small pace between writes costs a few minutes on the backfill and keeps the steady
            # state well under the secondary limit.
            sleep 0.4
            return "$_rc"
          }
          while : ; do
            page=$((page+1))
            if [ "$page" -gt 100 ]; then truncated=1; break; fi
            resp="$(gh api graphql -f query='
              query($p:ID!,$after:String){ node(id:$p){ ... on ProjectV2 {
                items(first:100,after:$after){ pageInfo{ hasNextPage endCursor }
                  nodes{
                    id
                    fieldValues(first:30){ nodes{ ... on ProjectV2ItemFieldSingleSelectValue {
                      name field{ ... on ProjectV2SingleSelectField { name } } } } }
                    content{ ... on Issue { number state repository{ nameWithOwner } url author{ login }
                      labels(first:20){ nodes{ name } } } }
                  } } } } }' -F p="$PROJECT_ID" ${after:+-F after="$after"})"
            echo "$resp" | jq -c '.data.node.items.nodes[]
              | select(.content!=null and .content.state=="OPEN")
              | { itemId:.id, repo:.content.repository.nameWithOwner, num:.content.number, url:.content.url,
                  author:(.content.author.login // ""),
                  hasTriage:([.content.labels.nodes[].name]|any(.=="needs-triage")),
                  area:([.fieldValues.nodes[]|select(.field.name=="Area")|.name]|first),
                  prio:([.fieldValues.nodes[]|select(.field.name=="Priority")|.name]|first) }
              | select(.area==null or .prio==null or .hasTriage)' > flagged.jsonl || true

            # Fixed allow-list, case-sensitive exact match only — the author login is NEVER
            # interpolated into a query or shell command, only compared in a bash case.
            bot_area_priority() {
              case "$1" in
                "renovate[bot]"|"dependabot[bot]"|"socket-security[bot]") echo "$AREA_FIELD_ID:7c7e1985 $PRIORITY_FIELD_ID:13a5abc5" ;;
                "corridor-security[bot]") echo "$AREA_FIELD_ID:024801bd $PRIORITY_FIELD_ID:461ad6cf" ;;
                *) echo "" ;;
              esac
            }
            set_project_field() {  # $1=itemId  $2=fieldId  $3=optionId
              gh api graphql -f query='
                mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{
                  projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' \
                -F p="$PROJECT_ID" -F i="$1" -F f="$2" -F o="$3" >/dev/null
            }

            while IFS= read -r row; do
              [ -n "$row" ] || continue
              repo="$(jq -r .repo <<<"$row")"; num="$(jq -r .num <<<"$row")"
              itemId="$(jq -r .itemId <<<"$row")"; login="$(jq -r .author <<<"$row")"
              area="$(jq -r .area <<<"$row")"; prio="$(jq -r .prio <<<"$row")"
              hasTriage="$(jq -r .hasTriage <<<"$row")"

              # Fully fielded but still carrying a stale needs-triage label (from before it was
              # completed) — strip the label so the Triage-health chart stops overcounting.
              if [ "$area" != "null" ] && [ "$prio" != "null" ]; then
                if edit_label "$repo" "$num" --remove-label; then
                  unlabeled=$((unlabeled+1))
                fi
                continue
              fi

              bot_vals="$(bot_area_priority "$login")"
              if [ -n "$bot_vals" ]; then
                for pair in $bot_vals; do
                  fid="${pair%%:*}"; opt="${pair##*:}"
                  if [ "$fid" = "$AREA_FIELD_ID" ] && [ "$area" = "null" ]; then
                    set_project_field "$itemId" "$fid" "$opt"
                  elif [ "$fid" = "$PRIORITY_FIELD_ID" ] && [ "$prio" = "null" ]; then
                    set_project_field "$itemId" "$fid" "$opt"
                  fi
                done
                classified=$((classified+1))
              elif [ "$hasTriage" = "true" ]; then
                # Already flagged and still under-fielded — nothing to write. Counted separately
                # so the summary distinguishes "this sweep flagged N" from "N are standing
                # backlog being recounted"; the old `missing` conflated the two.
                standing=$((standing+1))
              else
                if edit_label "$repo" "$num" --add-label; then
                  missing=$((missing+1))
                fi
              fi
            done < flagged.jsonl
            hasNext="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"$resp")"
            after="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"$resp")"
            [ "$hasNext" = "true" ] || break
          done
          # Every number below is a count of writes that RETURNED SUCCESS, not of writes attempted.
          {
            echo "### Triage-health sweep"
            echo "Newly flagged **$missing** open board item(s) missing Area or Priority as \`needs-triage\`; **$standing** were already flagged and remain under-fielded; auto-classified **$classified** known-bot item(s); cleared the stale label from **$unlabeled** now-fully-fielded item(s)."
            echo "Label writes that FAILED: **$failed**."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$truncated" -eq 1 ]; then
            echo "::warning title=ticket-hygiene sweep TRUNCATED::the 100-page cap (10000 board items) was reached while more pages remained — items beyond it were never examined. Raise the cap or the sweep is silently partial."
            echo "> ⚠️ **Truncated** at the 100-page cap; items beyond 10000 were never examined." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$failed" -gt 0 ]; then
            {
              echo ""
              echo "<details><summary>First 20 label-write failures</summary>"
              echo ""
              echo '```'
              head -n 20 label-failures.txt
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$missing" -eq 0 ] && [ "$unlabeled" -eq 0 ]; then
              # Total write-path failure: every label write this sweep attempted was rejected, so
              # "flagged 0" cannot be told apart from "there was nothing to flag". That conflation
              # is the exact silent-masking failure this job exists to detect — stay loud and
              # non-zero.
              echo "::error title=ticket-hygiene label writes FAILED::$failed label write(s) were rejected and none succeeded; the board's needs-triage state is NOT what this run reports."
              exit 1
            fi
            # Partial tail: some writes landed, a handful were rejected (the App is not installed
            # on that repo, or the issue's repo is archived — environment gaps, not a broken
            # sweep). The honest `failed` counter plus this annotation keep the detector's job
            # done; a hard exit here turns the daily backstop into permanent red noise over a few
            # items out of thousands.
            echo "::warning title=ticket-hygiene label writes partially failed::$failed label write(s) were rejected; the board's needs-triage state is PARTIAL for these items (details in step summary)."
          fi

      - name: Auto-add non-WSC issues to the board
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          EXCLUDE_REPO: ${{ vars.HYGIENE_EXCLUDE_REPOS }}
        run: |
          set -euo pipefail
          added=0; capped="no"; after=""; page=0; walked=0; declared=-1
          # excluded repo is injected via a repo variable so its (private) name stays out of this public source
          excl=""; [ -n "${EXCLUDE_REPO:-}" ] && excl="-repo:$EXCLUDE_REPO"
          while : ; do
            page=$((page+1)); [ "$page" -le 20 ] || break
            resp="$(gh api graphql -f query='
              query($q:String!,$after:String){ search(query:$q, type:ISSUE, first:100, after:$after){
                issueCount
                pageInfo{ hasNextPage endCursor }
                nodes{ ... on Issue { id number repository{ nameWithOwner }
                  projectItems(first:10){ nodes{ project{ id } } } } } } }' \
              -F q="org:wave-av is:issue is:open $excl" ${after:+-F after="$after"})"
            # GitHub's search API hard-caps at 1000 RESULTS however the caller paginates: past that
            # `hasNextPage` simply goes false. No error, no warning — and the step's normal
            # termination condition is that same false, so a truncated run is indistinguishable
            # from "everything is already on the board". Measured 2026-08-04, this query returned
            # 951 of a possible 1000.
            #
            # `issueCount` is the TRUE total and rides on every page, so the invariant is free:
            # walk to the end, then assert we saw as many as the API said existed.
            [ "$declared" -ge 0 ] || declared="$(jq -r '.data.search.issueCount' <<<"$resp")"
            walked=$(( walked + $(jq -r '.data.search.nodes | length' <<<"$resp") ))
            echo "$resp" | jq -c --arg pid "$PROJECT_ID" '.data.search.nodes[]
              | select(([.projectItems.nodes[].project.id] | index($pid)) == null)
              | { id:.id, num:.number, repo:.repository.nameWithOwner }' > candidates.jsonl || true
            while IFS= read -r row; do
              [ -n "$row" ] || continue
              [ "$added" -lt 200 ] || { capped="yes"; break; }
              repo="$(jq -r .repo <<<"$row")"
              # double-guard the WSC exclusion even though the search already excludes it
              if [ -n "${EXCLUDE_REPO:-}" ] && [ "$repo" = "$EXCLUDE_REPO" ]; then continue; fi
              nodeId="$(jq -r .id <<<"$row")"
              gh api graphql -f query='
                mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }' \
                -F p="$PROJECT_ID" -F c="$nodeId" >/dev/null
              added=$((added+1))
            done < candidates.jsonl
            [ "$added" -lt 200 ] || { capped="yes"; break; }
            hasNext="$(jq -r '.data.search.pageInfo.hasNextPage' <<<"$resp")"
            after="$(jq -r '.data.search.pageInfo.endCursor' <<<"$resp")"
            [ "$hasNext" = "true" ] || break
          done
          if [ "$capped" = "yes" ]; then
            # Was a bare stdout line in a log nobody reads. An annotation is the point: this is a
            # partial run, and the summary's "Auto-added N" reads as complete without it.
            echo "::warning title=auto-add hit its 200-per-run limit::more off-board issues may remain; they wait for the next scheduled run."
          fi
          # The truncation assert. `declared` stays -1 only if the very first query failed to
          # return a count, which is itself worth saying rather than silently skipping the check.
          if [ "$declared" -lt 0 ]; then
            echo "::warning title=auto-add could not read issueCount::the search-truncation check did not run, so this run's coverage is unverified."
          elif [ "$walked" -lt "$declared" ]; then
            echo "::warning title=auto-add search TRUNCATED::walked $walked of $declared matching issue(s) — GitHub caps search at 1000 results regardless of pagination. Issues beyond the cap were never examined and NOTHING will add them to the board. Shard the query (by repo, or by created: window)."
          fi
          {
            echo "Auto-added **$added** non-WSC issue(s) to the board (200-per-run limit hit: $capped)."
            echo "Search coverage: examined **$walked** of **$declared** matching issue(s)."
          } >> "$GITHUB_STEP_SUMMARY"
